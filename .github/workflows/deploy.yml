# Manual CD — image build/push + opsional SSH runtime deploy
name: Deploy images

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Hansı image(lər)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - api
          - web
          - admin
      deploy_runtime:
        description: 'SSH ilə host-da compose up (DEPLOY_* secret-ləri lazımdır)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            file: apps/api/Dockerfile
            image: xidmetal-api
          - app: web
            file: apps/web/Dockerfile
            image: xidmetal-web
          - app: admin
            file: apps/admin/Dockerfile
            image: xidmetal-admin
    steps:
      - uses: actions/checkout@v4

      - name: Skip matrix row
        id: skip
        run: |
          if [ "${{ inputs.app }}" = "all" ] || [ "${{ inputs.app }}" = "${{ matrix.app }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.skip.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.skip.outputs.run == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.skip.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: |
            API_URL=${{ vars.API_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_ADMIN_URL=${{ vars.NEXT_PUBLIC_ADMIN_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_MAPBOX_TOKEN=${{ vars.NEXT_PUBLIC_MAPBOX_TOKEN }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_PAYMENTS_ENABLED=${{ vars.NEXT_PUBLIC_PAYMENTS_ENABLED }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_FCM_VAPID_KEY=${{ vars.NEXT_PUBLIC_FCM_VAPID_KEY }}
            NEXT_PUBLIC_FCM_API_KEY=${{ vars.NEXT_PUBLIC_FCM_API_KEY }}
            NEXT_PUBLIC_FCM_PROJECT_ID=${{ vars.NEXT_PUBLIC_FCM_PROJECT_ID }}
            NEXT_PUBLIC_FCM_APP_ID=${{ vars.NEXT_PUBLIC_FCM_APP_ID }}
            NEXT_PUBLIC_FCM_MESSAGING_SENDER_ID=${{ vars.NEXT_PUBLIC_FCM_MESSAGING_SENDER_ID }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: inputs.deploy_runtime
    runs-on: ubuntu-latest
    steps:
      - name: Require deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY secret-ləri lazımdır"
            exit 1
          fi

      - name: Deploy via SSH (compose pull + up)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || 22 }}
          envs: GHCR_TOKEN,IMAGE_OWNER,IMAGE_TAG,DEPLOY_PATH,API_REPLICAS
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$IMAGE_OWNER" --password-stdin
            export XIDMETAL_API_IMAGE="ghcr.io/${IMAGE_OWNER}/xidmetal-api:${IMAGE_TAG}"
            export XIDMETAL_WEB_IMAGE="ghcr.io/${IMAGE_OWNER}/xidmetal-web:${IMAGE_TAG}"
            export XIDMETAL_ADMIN_IMAGE="ghcr.io/${IMAGE_OWNER}/xidmetal-admin:${IMAGE_TAG}"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans --scale api="${API_REPLICAS:-3}"
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/xidmetal' }}
          API_REPLICAS: ${{ vars.API_REPLICAS || 3 }}
