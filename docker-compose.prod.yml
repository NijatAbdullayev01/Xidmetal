# Production app stack — infra (postgres/redis) ilə birlikdə:
#
# Lokal build (API ×2 + nginx LB — 5k concurrent hədəf):
#   API_REPLICAS=3 docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d --build --scale api=3
#
# GHCR image (deploy host):
#   XIDMETAL_API_IMAGE=ghcr.io/<org>/xidmetal-api:<tag> \
#   XIDMETAL_WEB_IMAGE=ghcr.io/<org>/xidmetal-web:<tag> \
#   XIDMETAL_ADMIN_IMAGE=ghcr.io/<org>/xidmetal-admin:<tag> \
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull && \
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --scale api=${API_REPLICAS:-3}
#
# Konteyner şəbəkəsi: postgres:5432, redis:6379 (host portları 5434/6380 deyil).
# Brauzerə açıq URL-lər (NEXT_PUBLIC_*) host-mapped origin olmalıdır.
# API host portu nginx vasitəsilə (4000) — birbaşa api konteynerinə deyil.
# TRUST_PROXY=true və REDIS_URL production-da məcburidir (bax: docs/CAPACITY.md).

services:
  postgres:
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1

  redis:
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --tcp-keepalive
      - '60'

  api:
    image: ${XIDMETAL_API_IMAGE:-xidmetal-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # container_name YOX — `docker compose --scale api=N` üçün
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://xidmetal:xidmetal_dev@postgres:5432/xidmetal?schema=public&connection_limit=15&pool_timeout=10}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379}
      RUN_MIGRATIONS_ON_BOOT: ${RUN_MIGRATIONS_ON_BOOT:-true}
      STORAGE_LOCAL_DIR: /app/uploads
      TRUST_PROXY: ${TRUST_PROXY:-true}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-300}
      PRISMA_CONNECTION_LIMIT: ${PRISMA_CONNECTION_LIMIT:-15}
    # Port birbaşa host-a açılmır — nginx vasitəsilə
    expose:
      - '4000'
    volumes:
      - api_uploads:/app/uploads
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-qO-',
          'http://127.0.0.1:4000/api/v1/health/ready',
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

  api-proxy:
    image: nginx:1.27-alpine
    container_name: xidmetal-api-proxy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${API_HOST_PORT:-4000}:4000'
    volumes:
      - ./ops/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/v1/health']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

  web:
    image: ${XIDMETAL_WEB_IMAGE:-xidmetal-web:local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: ${API_URL:-http://api-proxy:4000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3020}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://localhost:3021}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:4000}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_PAYMENTS_ENABLED: ${NEXT_PUBLIC_PAYMENTS_ENABLED:-false}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_FCM_VAPID_KEY: ${NEXT_PUBLIC_FCM_VAPID_KEY:-}
        NEXT_PUBLIC_FCM_API_KEY: ${NEXT_PUBLIC_FCM_API_KEY:-}
        NEXT_PUBLIC_FCM_PROJECT_ID: ${NEXT_PUBLIC_FCM_PROJECT_ID:-}
        NEXT_PUBLIC_FCM_APP_ID: ${NEXT_PUBLIC_FCM_APP_ID:-}
        NEXT_PUBLIC_FCM_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FCM_MESSAGING_SENDER_ID:-}
    container_name: xidmetal-web
    restart: unless-stopped
    depends_on:
      api-proxy:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3020
      API_URL: ${API_URL_INTERNAL:-http://api-proxy:4000}
    ports:
      - '${WEB_HOST_PORT:-3020}:3020'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3020/']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  admin:
    image: ${XIDMETAL_ADMIN_IMAGE:-xidmetal-admin:local}
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        API_URL: ${API_URL:-http://api-proxy:4000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://localhost:3021}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3020}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:4000}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    container_name: xidmetal-admin
    restart: unless-stopped
    depends_on:
      api-proxy:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3021
      API_URL: ${API_URL_INTERNAL:-http://api-proxy:4000}
    ports:
      - '${ADMIN_HOST_PORT:-3021}:3021'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3021/']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  api_uploads:
