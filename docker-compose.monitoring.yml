# Opsional monitoring stack — əsas docker-compose.yml dəyişmir.
#
# İşə salma (API artıq host-da :4000 dinləyirsə):
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml --profile monitoring up -d
#
# Grafana: http://localhost:3001  (admin / admin)
# Prometheus: http://localhost:9090

services:
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1
    container_name: xidmetal-prometheus
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - '127.0.0.1:9090:9090'

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.3.1
    container_name: xidmetal-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD təyin edin}
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '127.0.0.1:3001:3000'

volumes:
  prometheus_data:
  grafana_data:
