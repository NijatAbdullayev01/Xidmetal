# xidmetal.com — host nginx (shared VPS).
# Bu maşında :80/:443 artıq it-market.org üçündür; docker edge (docker-compose.cloudflare.yml)
# eyni portları tuta bilməz. Origin: 127.0.0.1:{3020,3021,4000}.
#
# Install:
#   cp ops/nginx/cloudflare-realip.conf /etc/nginx/snippets/cloudflare-realip.conf
#   cp ops/nginx/google-site-verification.conf /etc/nginx/snippets/google-site-verification.conf
#   cp ops/nginx/xidmetal.com.conf /etc/nginx/sites-available/xidmetal.com
#   ln -sf /etc/nginx/sites-available/xidmetal.com /etc/nginx/sites-enabled/xidmetal.com
#   nginx -t && systemctl reload nginx
#
# SSL: self-signed origin cert (Cloudflare SSL mode = Full).
# Full (strict) üçün Cloudflare Origin CA: /etc/nginx/ssl/xidmetal.com.crt + .key

map $http_upgrade $xidmetal_connection_upgrade {
  default upgrade;
  ''      close;
}

map $http_x_forwarded_proto $xidmetal_forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

upstream xidmetal_web {
  server 127.0.0.1:3020;
  keepalive 16;
}

upstream xidmetal_admin {
  server 127.0.0.1:3021;
  keepalive 8;
}

upstream xidmetal_provider {
  server 127.0.0.1:3022;
  keepalive 8;
}

upstream xidmetal_api {
  server 127.0.0.1:4000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name xidmetal.com www.xidmetal.com admin.xidmetal.com provider.xidmetal.com;

  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    allow all;
  }

  location /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  include snippets/google-site-verification.conf;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.xidmetal.com;

  ssl_certificate     /etc/nginx/ssl/xidmetal.com.crt;
  ssl_certificate_key /etc/nginx/ssl/xidmetal.com.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  include snippets/google-site-verification.conf;

  location / {
    return 301 https://xidmetal.com$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name xidmetal.com;

  ssl_certificate     /etc/nginx/ssl/xidmetal.com.crt;
  ssl_certificate_key /etc/nginx/ssl/xidmetal.com.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 25m;
  include snippets/cloudflare-realip.conf;

  location /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  include snippets/google-site-verification.conf;

  location = /sitemap.xml {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $xidmetal_forwarded_proto;
    proxy_read_timeout 25s;
    proxy_pass http://xidmetal_web;
  }

  location = /robots.txt {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $xidmetal_forwarded_proto;
    proxy_read_timeout 10s;
    proxy_pass http://xidmetal_web;
  }

  location /socket.io/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $xidmetal_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $xidmetal_connection_upgrade;
    proxy_read_timeout 120s;
    proxy_buffering off;
    proxy_pass http://xidmetal_api;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $xidmetal_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $xidmetal_connection_upgrade;
    proxy_read_timeout 120s;
    proxy_pass http://xidmetal_api;
  }

  location /uploads/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $xidmetal_forwarded_proto;
    proxy_pass http://xidmetal_api;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $xidmetal_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $xidmetal_connection_upgrade;
    proxy_pass http://xidmetal_web;
  }
}

