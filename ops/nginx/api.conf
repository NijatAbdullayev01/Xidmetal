# API reverse proxy — multi-replica + WebSocket.
# Docker embedded DNS (127.0.0.11) — `api` scaled olanda A record yenilənir.
# Socket.IO Redis adapter sticky session tələb etmir.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Host nginx (CF realip) X-Real-IP ötürür. Boşdursa TCP peer (lokal birbaşa giriş).
map $http_x_real_ip $xidmetal_client_ip {
  default $http_x_real_ip;
  ''      $remote_addr;
}

map $http_x_forwarded_proto $xidmetal_forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 4000;
  server_name _;

  client_max_body_size 25m;

  # Compose DNS
  resolver 127.0.0.11 ipv6=off valid=5s;
  resolver_timeout 3s;

  location / {
    set $api_upstream http://api:4000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $xidmetal_client_ip;
    proxy_set_header X-Forwarded-For $xidmetal_client_ip;
    proxy_set_header X-Forwarded-Proto $xidmetal_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;

    # Socket.IO long-poll / WS
    proxy_buffering off;

    proxy_pass $api_upstream;
  }
}
