# Prometheus scrape — Xidmətal API
# Hədəf: host-da işləyən API (port 4000). Docker-dan host üçün host.docker.internal.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: xidmetal-api
    metrics_path: /api/v1/metrics
    scheme: http
    # Production-da METRICS_TOKEN təyin olunubsa:
    # authorization:
    #   type: Bearer
    #   credentials: <METRICS_TOKEN>
    static_configs:
      - targets: ['host.docker.internal:4000']
        labels:
          service: xidmetal-api
          env: local
