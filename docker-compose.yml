# Production infra (xidmetal.com). `docker compose down` canlı DB-ni dayandırır.
# Lokal inkişaf: docker-compose.dev.yml — `pnpm docker:dev` (port 5435/6381).

services:
  postgres:
    # PostGIS lazımdır (Faza 2 ST_DWithin). Köhnə postgres:16-alpine volume-u
    # PostGIS image ilə uyğun olmaya bilər — təmiz start: docker compose down -v && up -d
    image: postgis/postgis:16-3.5
    container_name: xidmetal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: xidmetal
      POSTGRES_PASSWORD: xidmetal_dev
      POSTGRES_DB: xidmetal
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xidmetal -d xidmetal']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xidmetal-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
