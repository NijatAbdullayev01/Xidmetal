# Cloudflare edge — public :80/:443. WEB_HOST məcburidir (.env).
#
#   pnpm docker:prod:cloudflare
#
# Origin CA (tövsiyə, SSL Full strict):
#   ops/certs/origin.pem + ops/certs/origin.key
# Yoxdursa yalnız :80 (Cloudflare SSL Flexible).
#
# App portlarını internetə açmayın:
#   WEB_HOST_PORT=127.0.0.1:3020
#   ADMIN_HOST_PORT=127.0.0.1:3021
#   API_HOST_PORT=127.0.0.1:4000

services:
  edge:
    image: nginx:1.27-alpine
    container_name: xidmetal-edge
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      api-proxy:
        condition: service_healthy
    ports:
      - '${EDGE_HTTP_PORT:-80}:80'
      - '${EDGE_HTTPS_PORT:-443}:443'
    environment:
      WEB_HOST: ${WEB_HOST:-}
      ADMIN_HOST: ${ADMIN_HOST:-}
      WWW_HOST: ${WWW_HOST:-}
    volumes:
      - ./ops/nginx/edge-entrypoint.sh:/edge-entrypoint.sh:ro
      - ./ops/nginx/edge-http.conf.template:/templates/edge-http.conf.template:ro
      - ./ops/nginx/edge-ssl.conf.template:/templates/edge-ssl.conf.template:ro
      - ./ops/nginx/cloudflare-realip.conf:/etc/nginx/cloudflare-realip.conf:ro
      - ./ops/certs:/etc/nginx/certs:ro
    entrypoint: ['/bin/sh', '/edge-entrypoint.sh']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 5
